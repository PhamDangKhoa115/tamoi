      body {
        margin: 0;
        background: #fff4e2;
      }
      a {
        color: #8f1311;
      }
      a:hover {
        color: #5e0b0a;
      }
      @keyframes tamRise {
        from {
          opacity: 0;
          transform: translateY(34px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes tamPop {
        0% {
          opacity: 0;
          transform: scale(0.85) rotate(-2deg);
        }
        70% {
          transform: scale(1.03);
        }
        100% {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes tamDrift {
        0%,
        100% {
          transform: translateY(0) rotate(-8deg);
        }
        50% {
          transform: translateY(-22px) rotate(8deg);
        }
      }
      @keyframes tamBob {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-10px);
        }
      }
      @keyframes tamSpin {
        from {
          transform: rotate(0);
        }
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes tamMarquee {
        from {
          transform: translateX(0);
        }
        to {
          transform: translateX(-50%);
        }
      }
      @keyframes tamDash {
        to {
          stroke-dashoffset: -40;
        }
      }
      .tam-rise {
        animation: tamRise 0.8s cubic-bezier(0.2, 0.7, 0.2, 1) both;
      }
      .tam-d1 {
        animation-delay: 0.15s;
      }
      .tam-d2 {
        animation-delay: 0.3s;
      }
      .tam-d3 {
        animation-delay: 0.45s;
      }
      .tam-pop {
        animation: tamPop 0.5s cubic-bezier(0.2, 0.8, 0.3, 1.2) both;
      }
      .tam-drift {
        animation: tamDrift 5.5s ease-in-out infinite;
      }
      .tam-drift2 {
        animation: tamDrift 7s ease-in-out -2s infinite;
      }
      .tam-bob {
        animation: tamBob 3.2s ease-in-out infinite;
      }
      .tam-bob2 {
        animation: tamBob 3.6s ease-in-out -1.2s infinite;
      }
      .tam-spin {
        animation: tamSpin 18s linear infinite;
      }
      .tam-marquee {
        animation: tamMarquee 24s linear infinite;
      }
      .tam-dash {
        animation: tamDash 1.2s linear infinite;
      }
      @media (max-width: 900px) {
        .tam-floaters img {
          opacity: 0.35;
        }
      }
      @keyframes tamStripIn {
        from {
          opacity: 0;
          transform: translateY(40px);
        }
      }
      @keyframes tamPolIn {
        from {
          opacity: 0;
          transform: scale(0.6) rotate(-14deg);
        }
      }
      .tam-strip {
        transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.3, 1.2);
        animation: tamStripIn 0.8s cubic-bezier(0.2, 0.8, 0.3, 1.1) backwards;
      }
      .tam-strip1 {
        transform: translateY(-16px);
      }
      .tam-strip2 {
        transform: translateY(18px);
        animation-delay: 0.12s;
      }
      .tam-strip3 {
        transform: translateY(-4px);
        animation-delay: 0.24s;
      }
      .tam-split:hover .tam-strip {
        transform: none;
      }
      .tam-in1 {
        animation: tamPolIn 0.55s 0.52s cubic-bezier(0.2, 0.8, 0.3, 1.3) both;
      }
      .tam-in2 {
        animation: tamPolIn 0.55s 0.64s cubic-bezier(0.2, 0.8, 0.3, 1.3) both;
      }
      .tam-in3 {
        animation: tamPolIn 0.55s 0.76s cubic-bezier(0.2, 0.8, 0.3, 1.3) both;
      }
      .tam-in4 {
        animation: tamPolIn 0.55s 0.88s cubic-bezier(0.2, 0.8, 0.3, 1.3) both;
      }
      .tam-in5 {
        animation: tamPolIn 0.55s 1s cubic-bezier(0.2, 0.8, 0.3, 1.3) both;
      }
      .tam-in6 {
        animation: tamPolIn 0.55s 1.12s cubic-bezier(0.2, 0.8, 0.3, 1.3) both;
      }
      .tam-sticker {
        transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.3, 1.3);
      }
      .tam-sticker:hover {
        transform: rotate(0deg) scale(1.04);
      }
      @media (prefers-reduced-motion: reduce) {
        .tam-rise,
        .tam-pop,
        .tam-drift,
        .tam-drift2,
        .tam-bob,
        .tam-bob2,
        .tam-spin,
        .tam-marquee,
        .tam-dash,
        .tam-strip,
        .tam-in1,
        .tam-in2,
        .tam-in3,
        .tam-in4,
        .tam-in5,
        .tam-in6 {
          animation: none;
        }
      }

      class Component extends DCLogic {
        constructor(props) {
          super(props);
          this.state = { person: 0, q: 0 };
        }
        renderVals() {
          var qs = [
            "Bạn hay gọi phần nào?",
            "Chữ “tấm” là gì?",
            "Cơm tấm và Sài Gòn?",
            "Muốn hỏi người bán điều gì?",
            "Điều gì khiến bạn tin?",
          ];
          var ppl = [
            {
              name: "Mỹ Anh",
              info: "Sinh viên năm 2, ngành Digital Marketing",
              color: "#F2B234",
              img: "assets/acbe4385141fd69c0ef670affba1114a.webp",
              a: [
                "Thường mình sẽ gọi cơm tấm sườn, đôi khi thêm trứng. Nếu đói hơn thì mình sẽ gọi thêm bì hoặc chả.",
                "Theo mình hiểu thì “tấm” là phần gạo bị vỡ ra trong quá trình xay xát… Nhưng mình cũng không dám chắc hoàn toàn về chi tiết này.",
                "Sau một ngày học mệt, mọi người rủ nhau “đi ăn cơm tấm hong” rồi tìm một quán gần đó.",
                "Theo cô/chú thì điều gì làm nên một dĩa cơm tấm ngon? Có quán sườn ngon, có quán nước mắm ngon.",
                "Mình thường xem ai là người nói và họ lấy thông tin từ đâu.",
              ],
            },
            {
              name: "Thúy Uyên",
              info: "Sinh viên năm cuối, đã sống ở TP.HCM được 3 năm",
              color: "#8F1311",
              img: "assets/3fbf4c1d8cab475c5daf3cb0e2b82c79.webp",
              a: [
                "Một phần cơm sườn trứng luôn là sự lựa chọn của mình.",
                "Chữ tấm là tên hạt của gạo nấu thành món cơm đó. Mình coi TikTok và nghe bà ngoại kể. Mình chắc chắn 100%, mình tin bà ngoại mình.",
                "Mình nghĩ là những người con xa quê tìm tới dĩa cơm mang hương vị na ná món ăn mẹ nấu.",
                "Mình muốn biết công thức ướp thịt, vì vị của miếng thịt làm nên hương vị đặc biệt của dĩa cơm tấm.",
                "Comment của cộng đồng mạng là điều khiến mình tin nhất.",
              ],
            },
            {
              name: "Quốc Đoàn",
              info: "Sinh viên năm 3, ngành Quan hệ Quốc tế",
              color: "#1E7A79",
              img: "assets/e80da17e4d3205bd34661d4fee9b8709.webp",
              a: [
                "Hay gọi sườn bì chả, có khi thêm trứng. Chắc từ khi nhỏ ba mẹ gọi cho ăn nên thành thói quen.",
                "Hình như là mấy hạt gạo bị bể nhỏ á, có nghe đâu đó trên mạng.",
                "Đi trên đường 10 quán hết 8 quán cơm tấm rồi.",
                "Quán bán cơm tấm được bao lâu rồi. Tại mình thấy nhiều quán nhìn kiểu gia truyền á.",
                "Chắc do phong thái với tác phong của người nói, nếu nhìn chuyên nghiệp thì chắc là uy tín.",
              ],
            },
          ];
          var pi = this.state.person,
            qi = this.state.q;
          var people = ppl.map((p, i) => {
            var on = i === pi;
            return {
              name: p.name,
              info: p.info,
              color: p.color,
              selected: on ? "true" : "false",
              style:
                "display: flex; align-items: center; gap: 12px; padding: 10px 18px 10px 10px; border-radius: 999px; border: 2px solid #2A1A12; cursor: pointer; font-family: Montserrat, sans-serif; transition: transform .2s; " +
                (on
                  ? "background: #F2B234; color: #2A1A12; box-shadow: 4px 4px 0 #2A1A12; transform: translateY(-3px);"
                  : "background: #FFFFFF; color: #2A1A12;"),
              pick: () => {
                if (this.state.person !== i)
                  window.TamOiAnalytics?.trackEvent("interview_tab_change", {
                    tab_id: "person_" + (i + 1),
                  });
                this.setState({ person: i });
              },
            };
          });
          var questions = qs.map((q, i) => {
            var on = i === qi;
            return {
              label: q,
              pressed: on ? "true" : "false",
              style:
                "font-family: Montserrat, sans-serif; font-weight: 700; font-size: 14px; padding: 10px 16px; min-height: 42px; border-radius: 999px; border: 2px solid #FFF4E2; cursor: pointer; " +
                (on
                  ? "background: #FFF4E2; color: #1E7A79;"
                  : "background: transparent; color: #FFF4E2;"),
              pick: () => this.setState({ q: i }),
            };
          });
          var cur = ppl[pi];
          return {
            people: people,
            questions: questions,
            bubbles: [
              {
                question: qs[qi].toUpperCase(),
                answer: cur.a[qi],
                who:
                  cur.name +
                  " – " +
                  cur.info.charAt(0).toLowerCase() +
                  cur.info.slice(1),
                key: pi + "-" + qi,
              },
            ],
            tamImg: cur.img,
          };
        }
      }
      TamOi.mount(Component);
    </script>
