<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tấm Ơi! – Ráp dĩa cơm của bạn</title>
<meta name="description" content="Tự ráp dĩa cơm tấm: xới cơm, chọn món, chan nước mắm và nhận phiếu gọi món.">
<meta property="og:title" content="Tấm Ơi! – Ráp dĩa cơm của bạn">
<meta property="og:description" content="Tự ráp dĩa cơm tấm: xới cơm, chọn món, chan nước mắm và nhận phiếu gọi món.">
<meta property="og:image" content="assets/ee5aac514a7739de9ae7866082d03e62.webp">
<link rel="icon" href="assets/91466ccee28ddb467ce98702ae1e4e30.webp" type="image/webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&amp;family=Montserrat:wght@400;500;600;700&amp;family=Courier+Prime:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#1E7A79}
a{color:#8F1311}a:hover{color:#5E0B0A}
@keyframes tamDrop{0%{opacity:0;transform:translateY(-140px) scale(1.25) rotate(var(--r,0deg))}60%{opacity:1;transform:translateY(8px) scale(.96) rotate(var(--r,0deg))}80%{transform:translateY(-4px) scale(1.02) rotate(var(--r,0deg))}100%{opacity:1;transform:translateY(0) scale(1) rotate(var(--r,0deg))}}
@keyframes tamScoop{0%{opacity:0;transform:scale(.2)}70%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes tamTilt{0%{transform:rotate(0)}30%,80%{transform:rotate(-58deg)}100%{transform:rotate(0)}}
@keyframes tamDrip{0%{opacity:0;transform:translateY(0) scale(.6)}20%{opacity:1}100%{opacity:0;transform:translateY(150px) scale(1)}}
@keyframes tamGlaze{from{opacity:0;transform:scale(.6)}to{opacity:.62;transform:scale(1)}}
@keyframes tamSteam{0%{opacity:0;transform:translateY(16px) scaleX(1)}35%{opacity:.8}100%{opacity:0;transform:translateY(-90px) scaleX(1.6)}}
@keyframes tamTwinkle{0%,100%{opacity:0;transform:scale(.3) rotate(0)}50%{opacity:1;transform:scale(1) rotate(45deg)}}
@keyframes tamFall{0%{opacity:0;transform:translateY(-40px) rotate(0)}15%{opacity:1}100%{opacity:0;transform:translateY(520px) rotate(320deg)}}
@keyframes tamSlideUp{from{opacity:0;transform:translateY(60px) rotate(2deg)}to{opacity:1;transform:rotate(-1.2deg)}}
@keyframes tamStamp{0%{opacity:0;transform:scale(2.4) rotate(-30deg)}70%{opacity:1;transform:scale(.9) rotate(-14deg)}100%{opacity:1;transform:scale(1) rotate(-14deg)}}
@keyframes tamBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes tamGlow{0%,100%{box-shadow:0 0 0 0 rgba(242,178,52,0)}50%{box-shadow:0 0 0 18px rgba(242,178,52,.35)}}
.tam-drop{animation:tamDrop .7s cubic-bezier(.2,.8,.3,1) both}
.tam-scoop{animation:tamScoop .6s cubic-bezier(.2,.8,.3,1.3) both}
.tam-tilt{animation:tamTilt 1.8s ease-in-out both;transform-origin:85% 70%}
.tam-drip{animation:tamDrip .9s ease-in infinite}
.tam-drip2{animation:tamDrip .9s ease-in .3s infinite}
.tam-drip3{animation:tamDrip .9s ease-in .6s infinite}
.tam-glaze{animation:tamGlaze 1.2s ease-out both}
.tam-steam{animation:tamSteam 2.6s ease-out infinite}
.tam-steam2{animation:tamSteam 2.6s ease-out .9s infinite}
.tam-steam3{animation:tamSteam 2.6s ease-out 1.7s infinite}
.tam-twinkle{animation:tamTwinkle 1.8s ease-in-out infinite}
.tam-twinkle2{animation:tamTwinkle 1.8s ease-in-out .6s infinite}
.tam-twinkle3{animation:tamTwinkle 1.8s ease-in-out 1.2s infinite}
.tam-fall{animation:tamFall 3.2s linear infinite}
.tam-slideup{animation:tamSlideUp .8s cubic-bezier(.2,.8,.3,1) both}
.tam-stamp{animation:tamStamp .6s cubic-bezier(.2,.8,.3,1.2) .5s both}
.tam-bob{animation:tamBob 3s ease-in-out infinite}
.tam-glow{animation:tamGlow 1.6s ease-in-out 2}
.tam-tile{transition:transform .2s ease, box-shadow .2s ease}
.tam-tile:hover{transform:translate(-3px,-3px);box-shadow:6px 6px 0 #2A1A12}
@media (prefers-reduced-motion: reduce){.tam-drop,.tam-scoop,.tam-tilt,.tam-drip,.tam-drip2,.tam-drip3,.tam-glaze,.tam-steam,.tam-steam2,.tam-steam3,.tam-twinkle,.tam-twinkle2,.tam-twinkle3,.tam-fall,.tam-slideup,.tam-stamp,.tam-bob,.tam-glow{animation:none}}
</style>
<meta property="og:type" content="website">
<meta name="theme-color" content="#8F1311">
<link rel="stylesheet" href="css/production.css">
<link rel="stylesheet" href="css/enhancements.css">
<script src="js/analytics.js"></script>
<link rel="stylesheet" href="css/footer-social.css">
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div style="font-family: Montserrat, sans-serif; color: #2A1A12; background: #1E7A79; min-height: 100vh;">
  <header style="background: #FFF4E2; border-bottom: 2px solid #2A1A12;">
    <div style="max-width: 1240px; margin: 0 auto; padding: 12px 24px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between;">
      <a href="index.html#tro-choi" style="display: flex; align-items: center; gap: 10px; font-weight: 700; text-decoration: none; padding: 8px 0;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8F1311" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
        Góc trò chơi
      </a>
      <img src="assets/91466ccee28ddb467ce98702ae1e4e30.webp" alt="Tấm Ơi!" style="height: 44px; width: auto;">
    </div>
  </header>

  <main style="max-width: 1240px; margin: 0 auto; padding: 36px 24px 72px; display: flex; flex-direction: column; gap: 26px;">
    <div style="display: flex; flex-wrap: wrap; gap: 16px 32px; align-items: flex-end; justify-content: space-between; color: #FFF4E2;">
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <span style="font-weight: 700; font-size: 13px; letter-spacing: .12em; color: #F2B234;">GAME 01 · KHOẢNG 60 GIÂY</span>
        <h1 data-tamoi-fx="split" style="margin: 0; font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: clamp(40px, 5vw, 64px); line-height: 1; text-shadow: 4px 4px 0 #2A1A12;">Ráp dĩa cơm của bạn</h1>
      </div>
      <ol aria-label="Các bước" style="list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px;">
        <sc-for list="{{steps}}" as="s" hint-placeholder-count="4">
          <li style="{{s.style}}">{{s.label}}</li>
        </sc-for>
      </ol>
    </div>

    <div style="display: flex; flex-wrap: wrap; gap: 28px; align-items: stretch;">
      <!-- STAGE -->
      <div style="flex: 1.25 1 520px; position: relative; background: #842A0D; border: 2px solid #2A1A12; border-radius: 32px; box-shadow: 8px 8px 0 #2A1A12; padding: 28px; display: flex; align-items: center; justify-content: center; overflow: hidden; min-height: 600px; box-sizing: border-box;">
        <div aria-hidden="true" style="position: absolute; inset: 0; background: repeating-linear-gradient(90deg, rgba(255,255,255,.05) 0 2px, transparent 2px 46px);"></div>
        <sc-if value="{{served}}" hint-placeholder-val="{{false}}">
          <span aria-hidden="true" class="tam-fall" style="position: absolute; top: 0; left: 12%; width: 9px; height: 16px; border-radius: 50%; background: #FFF4E2;"></span>
          <span aria-hidden="true" class="tam-fall" style="position: absolute; top: 0; left: 34%; width: 8px; height: 14px; border-radius: 50%; background: #FFF4E2; animation-delay: 1s;"></span>
          <span aria-hidden="true" class="tam-fall" style="position: absolute; top: 0; left: 58%; width: 9px; height: 16px; border-radius: 50%; background: #F2B234; animation-delay: .5s;"></span>
          <span aria-hidden="true" class="tam-fall" style="position: absolute; top: 0; left: 80%; width: 8px; height: 14px; border-radius: 50%; background: #FFF4E2; animation-delay: 1.6s;"></span>
          <span aria-hidden="true" class="tam-fall" style="position: absolute; top: 0; left: 90%; width: 9px; height: 16px; border-radius: 50%; background: #F2B234; animation-delay: 2.2s;"></span>
        </sc-if>

        <div style="{{plateStyle}}">
          <div aria-hidden="true" style="position: absolute; inset: 7%; border-radius: 50%; border: 3px solid #9DB8C4; opacity: .7;"></div>
          <div aria-hidden="true" style="position: absolute; inset: 9.5%; border-radius: 50%; border: 1.5px dashed #9DB8C4; opacity: .6;"></div>

          <sc-if value="{{hasRice}}" hint-placeholder-val="{{false}}">
            <img src="assets/493187095ff76ceac0882bddb8f3a3e6.webp" alt="Cơm tấm" class="tam-scoop" style="position: absolute; left: 20%; top: 12%; width: 44%; z-index: 1; filter: drop-shadow(0 6px 6px rgba(42,26,18,.25));">
          </sc-if>
          <sc-if value="{{has.bi}}" hint-placeholder-val="{{false}}">
            <img src="assets/884580e4f94cdd75b890ab41fe47b327.webp" alt="Bì" class="tam-drop" style="--r: -8deg; position: absolute; left: 3%; top: 38%; width: 34%; z-index: 2; filter: drop-shadow(0 6px 6px rgba(42,26,18,.3));">
          </sc-if>
          <sc-if value="{{has.rau}}" hint-placeholder-val="{{false}}">
            <img src="assets/525ab38af70e376faa191317da974833.webp" alt="Dưa leo" class="tam-drop" style="--r: 24deg; position: absolute; left: 63%; top: 9%; width: 20%; z-index: 2; filter: drop-shadow(0 5px 5px rgba(42,26,18,.3));">
            <img src="assets/234ca4f2ca81c6db24aa32699a6a5985.webp" alt="Cà chua" class="tam-drop" style="--r: 0deg; position: absolute; left: 76%; top: 28%; width: 17%; z-index: 2; animation-delay: .12s; filter: drop-shadow(0 5px 5px rgba(42,26,18,.3));">
          </sc-if>
          <sc-if value="{{has.dochua}}" hint-placeholder-val="{{false}}">
            <img src="assets/34aa95f3f8bb909d48c679c5deca4a16.webp" alt="Đồ chua" class="tam-drop" style="--r: -10deg; position: absolute; left: 50%; top: 67%; width: 30%; z-index: 3; filter: drop-shadow(0 5px 5px rgba(42,26,18,.3));">
          </sc-if>
          <sc-if value="{{has.cha}}" hint-placeholder-val="{{false}}">
            <img src="assets/efd21d52721eb4fa1bbec67bb5e188b2.webp" alt="Chả trứng" class="tam-drop" style="--r: 10deg; position: absolute; left: 18%; top: 63%; width: 33%; z-index: 3; filter: drop-shadow(0 6px 6px rgba(42,26,18,.3));">
          </sc-if>
          <sc-if value="{{has.suon}}" hint-placeholder-val="{{false}}">
            <img src="assets/763d213790e30d68969f8e30569152a8.webp" alt="Sườn nướng" class="tam-drop" style="--r: -14deg; position: absolute; left: 44%; top: 32%; width: 47%; z-index: 4; filter: drop-shadow(0 8px 8px rgba(42,26,18,.35));">
          </sc-if>
          <sc-if value="{{has.trung}}" hint-placeholder-val="{{false}}">
            <img src="assets/a4a364b81ca250aa61a847a46b521edd.webp" alt="Trứng ốp la" class="tam-drop" style="--r: 6deg; position: absolute; left: 26%; top: 5%; width: 33%; z-index: 5; filter: drop-shadow(0 6px 6px rgba(42,26,18,.3));">
          </sc-if>
          <sc-if value="{{poured}}" hint-placeholder-val="{{false}}">
            <span aria-hidden="true" class="tam-glaze" style="position: absolute; left: 24%; top: 18%; width: 34%; height: 26%; border-radius: 50%; background: radial-gradient(ellipse at center, rgba(214,104,30,.85), rgba(214,104,30,0) 70%); z-index: 6; mix-blend-mode: multiply;"></span>
            <span aria-hidden="true" class="tam-glaze" style="position: absolute; left: 50%; top: 40%; width: 34%; height: 24%; border-radius: 50%; background: radial-gradient(ellipse at center, rgba(190,80,20,.8), rgba(190,80,20,0) 70%); z-index: 6; mix-blend-mode: multiply; animation-delay: .3s;"></span>
          </sc-if>
          <sc-if value="{{served}}" hint-placeholder-val="{{false}}">
            <span aria-hidden="true" class="tam-steam" style="position: absolute; left: 38%; top: -2%; width: 16px; height: 70px; border-radius: 999px; background: rgba(255,244,226,.85); z-index: 8;"></span>
            <span aria-hidden="true" class="tam-steam2" style="position: absolute; left: 50%; top: -6%; width: 16px; height: 70px; border-radius: 999px; background: rgba(255,244,226,.85); z-index: 8;"></span>
            <span aria-hidden="true" class="tam-steam3" style="position: absolute; left: 62%; top: 0; width: 16px; height: 70px; border-radius: 999px; background: rgba(255,244,226,.85); z-index: 8;"></span>
            <svg aria-hidden="true" class="tam-twinkle" width="36" height="36" viewBox="0 0 24 24" style="position: absolute; left: -2%; top: 18%; z-index: 9;"><path d="M12 0l3 9 9 3-9 3-3 9-3-9-9-3 9-3z" fill="#F2B234"></path></svg>
            <svg aria-hidden="true" class="tam-twinkle2" width="28" height="28" viewBox="0 0 24 24" style="position: absolute; right: 2%; top: 60%; z-index: 9;"><path d="M12 0l3 9 9 3-9 3-3 9-3-9-9-3 9-3z" fill="#FFF4E2"></path></svg>
            <svg aria-hidden="true" class="tam-twinkle3" width="32" height="32" viewBox="0 0 24 24" style="position: absolute; left: 70%; top: -4%; z-index: 9;"><path d="M12 0l3 9 9 3-9 3-3 9-3-9-9-3 9-3z" fill="#F2B234"></path></svg>
          </sc-if>
          <sc-if value="{{empty}}" hint-placeholder-val="{{true}}">
            <span style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 22px; color: #9DB8C4;">Dĩa đang trống…</span>
          </sc-if>
        </div>

        <sc-if value="{{showBowl}}" hint-placeholder-val="{{false}}">
          <img src="assets/ecb543d54b9ef56164282cff516f4d21.webp" alt="Chén nước mắm" class="{{bowlClass}}" style="position: absolute; right: 5%; top: 6%; width: 21%; z-index: 10; filter: drop-shadow(0 6px 6px rgba(42,26,18,.4));">
        </sc-if>
        <sc-if value="{{pouring}}" hint-placeholder-val="{{false}}">
          <span aria-hidden="true" class="tam-drip" style="position: absolute; right: 22%; top: 22%; width: 12px; height: 18px; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; background: #D4681E; z-index: 11;"></span>
          <span aria-hidden="true" class="tam-drip2" style="position: absolute; right: 24%; top: 22%; width: 10px; height: 15px; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; background: #E07A2A; z-index: 11;"></span>
          <span aria-hidden="true" class="tam-drip3" style="position: absolute; right: 21%; top: 22%; width: 9px; height: 14px; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; background: #C25A18; z-index: 11;"></span>
        </sc-if>
      </div>

      <!-- PANEL -->
      <div style="flex: 1 1 380px; background: #FFF4E2; border: 2px solid #2A1A12; border-radius: 32px; box-shadow: 8px 8px 0 #2A1A12; padding: 28px; display: flex; flex-direction: column; gap: 18px; box-sizing: border-box;">
        <sc-if value="{{isStart}}" hint-placeholder-val="{{true}}">
          <div style="display: flex; flex-direction: column; gap: 16px; align-items: flex-start;">
            <img src="assets/4f5121b21112e79e34ff1406b65499b6.webp" alt="" class="tam-bob" style="height: 220px; width: auto; align-self: center;">
            <b style="font-family: 'Baloo 2', sans-serif; font-size: 30px; line-height: 1.1;">Bước 1 · Xới cơm</b>
            <p style="margin: 0; font-size: 16px; line-height: 1.6;">Mọi dĩa cơm tấm đều bắt đầu từ hạt tấm – những mảnh gạo vỡ nấu lên tơi xốp. Xới một vá lên dĩa nào!</p>
            <button data-tamoi-spark="ingredient" type="button" class="tam-glow" onClick="{{scoop}}" style="font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 24px; background: #8F1311; color: #FFF4E2; border: 2px solid #2A1A12; border-radius: 999px; padding: 12px 32px; box-shadow: 4px 4px 0 #2A1A12; cursor: pointer;">Xới cơm</button>
          </div>
        </sc-if>

        <sc-if value="{{isPick}}" hint-placeholder-val="{{false}}">
          <div style="display: flex; flex-direction: column; gap: 14px;">
            <b style="font-family: 'Baloo 2', sans-serif; font-size: 30px; line-height: 1.1;">Bước 2 · Chọn món ăn kèm</b>
            <p style="margin: 0; font-size: 15px; line-height: 1.55;">Bấm để thả lên dĩa, bấm lần nữa để bỏ ra. Gọi gì là quyền của bạn!</p>
            <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px;">
              <sc-for list="{{tops}}" as="t" hint-placeholder-count="6">
                <button data-tamoi-spark="ingredient" type="button" class="tam-tile" onClick="{{t.toggle}}" aria-pressed="{{t.pressed}}" style="{{t.style}}">
                  <img src="{{t.img}}" alt="" style="height: 64px; width: 100%; object-fit: contain;">
                  <span style="font-weight: 700; font-size: 13px; line-height: 1.2;">{{t.name}}</span>
                </button>
              </sc-for>
            </div>
            <button type="button" onClick="{{toSauce}}" style="align-self: flex-start; font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 22px; background: #8F1311; color: #FFF4E2; border: 2px solid #2A1A12; border-radius: 999px; padding: 10px 28px; box-shadow: 4px 4px 0 #2A1A12; cursor: pointer;">Tiếp: chan nước mắm</button>
          </div>
        </sc-if>

        <sc-if value="{{isSauce}}" hint-placeholder-val="{{false}}">
          <div style="display: flex; flex-direction: column; gap: 14px; align-items: flex-start;">
            <b style="font-family: 'Baloo 2', sans-serif; font-size: 30px; line-height: 1.1;">Bước 3 · Chan nước mắm “kẹo”</b>
            <p style="margin: 0; font-size: 15px; line-height: 1.6;">Một vòng nước mắm sánh, chua ngọt là thứ nối tất cả các vị lại với nhau.</p>
            <sc-if value="{{notPoured}}" hint-placeholder-val="{{true}}">
              <button data-tamoi-spark="ingredient" type="button" class="tam-glow" onClick="{{pour}}" style="font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 22px; background: #D4681E; color: #FFF4E2; border: 2px solid #2A1A12; border-radius: 999px; padding: 10px 28px; box-shadow: 4px 4px 0 #2A1A12; cursor: pointer;">Chan một vòng</button>
            </sc-if>
            <sc-if value="{{canServe}}" hint-placeholder-val="{{false}}">
              <button data-tamoi-spark="success" type="button" class="tam-glow" onClick="{{serve}}" style="font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 26px; background: #8F1311; color: #FFF4E2; border: 2px solid #2A1A12; border-radius: 999px; padding: 12px 34px; box-shadow: 4px 4px 0 #2A1A12; cursor: pointer;">Lên dĩa!</button>
            </sc-if>
            <button type="button" onClick="{{back}}" style="font-family: Montserrat, sans-serif; font-weight: 700; font-size: 14px; background: transparent; color: #2A1A12; border: none; text-decoration: underline; padding: 10px 0; cursor: pointer;">Quay lại chọn món</button>
          </div>
        </sc-if>

        <sc-if value="{{served}}" hint-placeholder-val="{{false}}">
          <div class="tam-slideup" style="position: relative; background: #FFFFFF; border: 2px solid #2A1A12; padding: 22px 22px 18px; font-family: 'Courier Prime', monospace; box-shadow: 6px 6px 0 #2A1A12;">
            <div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: -9px; height: 16px; background: radial-gradient(circle at 8px -2px, #FFF4E2 8px, transparent 8.5px) 0 0 / 16px 16px repeat-x;"></div>
            <div style="text-align: center; display: flex; flex-direction: column; gap: 2px;">
              <img src="assets/91466ccee28ddb467ce98702ae1e4e30.webp" alt="Tấm Ơi!" style="height: 46px; width: auto; align-self: center;">
              <b style="font-size: 15px; letter-spacing: .12em;">PHIẾU GỌI MÓN</b>
              <span style="font-size: 12px;">Bàn số 1 · Khách: Bạn</span>
            </div>
            <div style="border-top: 2px dashed #2A1A12; margin: 12px 0; height: 0;"></div>
            <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: 15px;">
              <sc-for list="{{receipt}}" as="r" hint-placeholder-count="4">
                <li style="display: flex; justify-content: space-between; gap: 10px;"><span>{{r.name}}</span><span>x1</span></li>
              </sc-for>
            </ul>
            <div style="border-top: 2px dashed #2A1A12; margin: 12px 0; height: 0;"></div>
            <span style="font-size: 12px; letter-spacing: .1em;">DANH HIỆU CỦA BẠN</span>
            <b data-tamoi-fx="reveal" style="display: block; font-family: 'Baloo 2', sans-serif; font-size: 30px; line-height: 1.05; color: #8F1311; margin: 4px 0 6px;">{{result.title}}</b>
            <p style="margin: 0; font-family: Montserrat, sans-serif; font-size: 14px; line-height: 1.55;">{{result.text}}</p>
            <p style="margin: 8px 0 0; font-family: Montserrat, sans-serif; font-size: 13px; line-height: 1.5; font-weight: 600; color: #1E7A79;">{{extra}}</p>
            <div style="border-top: 2px dashed #2A1A12; margin: 12px 0 8px; height: 0;"></div>
            <span style="display: block; text-align: center; font-size: 12px;">Theo tiếng gọi, khám phá vị Sài Gòn · #TamOi</span>

<script src="js/tamoi-runtime.js"></script>
<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { step: 'start', sel: {}, pouring: false, poured: false };
  }
  componentWillUnmount() { if (this.t1) clearTimeout(this.t1); }
  renderVals() {
    var list = [
      { id: 'suon', name: 'Sườn nướng', img: 'assets/763d213790e30d68969f8e30569152a8.webp' },
      { id: 'bi', name: 'Bì', img: 'assets/884580e4f94cdd75b890ab41fe47b327.webp' },
      { id: 'cha', name: 'Chả trứng', img: 'assets/efd21d52721eb4fa1bbec67bb5e188b2.webp' },
      { id: 'trung', name: 'Trứng ốp la', img: 'assets/a4a364b81ca250aa61a847a46b521edd.webp' },
      { id: 'dochua', name: 'Đồ chua', img: 'assets/34aa95f3f8bb909d48c679c5deca4a16.webp' },
      { id: 'rau', name: 'Dưa leo, cà chua', img: 'assets/525ab38af70e376faa191317da974833.webp' }
    ];
    var st = this.state, sel = st.sel, step = st.step;
    var order = ['start', 'pick', 'sauce', 'served'];
    var labels = ['1 · Xới cơm', '2 · Chọn món', '3 · Nước mắm', '4 · Lên dĩa'];
    var idx = order.indexOf(step);
    var steps = labels.map((l, i) => ({ label: l, style: 'font-weight: 700; font-size: 13px; padding: 8px 14px; border-radius: 999px; border: 2px solid #2A1A12; ' + (i === idx ? 'background: #F2B234; color: #2A1A12; box-shadow: 3px 3px 0 #2A1A12;' : (i < idx ? 'background: #FFF4E2; color: #1E7A79;' : 'background: transparent; color: #FFF4E2; border-color: #FFF4E2;')) }));
    var tops = list.map((t) => {
      var on = !!sel[t.id];
      return Object.assign({}, t, {
        pressed: on ? 'true' : 'false',
        style: 'display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 6px; min-height: 104px; border-radius: 16px; border: 2px solid #2A1A12; cursor: pointer; font-family: Montserrat, sans-serif; color: #2A1A12; ' + (on ? 'background: #F2B234; box-shadow: 3px 3px 0 #2A1A12;' : 'background: #FFFFFF;'),
        toggle: () => { var s = Object.assign({}, this.state.sel); if (s[t.id]) delete s[t.id]; else s[t.id] = true; this.setState({ sel: s }); }
      });
    });
    var mains = ['suon', 'bi', 'cha', 'trung'].filter((k) => sel[k]).length;
    var r;
    if (mains === 4) r = { title: 'Dân chơi “đầy đủ”', text: 'Không bỏ sót miếng nào, y như Tấm trong phim: “Cho con một dĩa đầy đủ!”' };
    else if (sel.suon && sel.trung && !sel.bi && !sel.cha) r = { title: 'Team sườn trứng kinh điển', text: 'Gọn mà chắc bụng. 2/3 bạn tụi mình phỏng vấn cũng gọi đúng phần này ở lần ăn gần nhất.' };
    else if (sel.suon && sel.bi && sel.cha && !sel.trung) r = { title: 'Bộ ba sườn bì chả', text: 'Truyền thống, quen thuộc, gọi một câu là cô chủ hiểu liền.' };
    else if (mains === 0) r = { title: 'Cơm tấm “trơn”', text: 'Chỉ có hạt tấm thôi? Bạn đang nhắc cả thế giới rằng “tấm” mới là nhân vật chính!' };
    else if (!sel.suon) r = { title: 'Người không theo số đông', text: 'Cơm tấm mà không sườn? Gu riêng như vậy mới là đặc sản.' };
    else r = { title: 'Gu riêng, không lẫn đi đâu', text: 'Dĩa của bạn là một kiểu phối riêng, giống cách mỗi quán Sài Gòn có một dĩa cơm riêng.' };
    var extra = (sel.dochua || sel.rau) ? 'Có thêm đồ chua, rau tươi: biết cân vị đó nha!' : 'Lần sau thử thêm chút đồ chua cho đỡ ngán nha!';
    var receipt = [{ name: 'Cơm tấm' }].concat(list.filter((t) => sel[t.id]).map((t) => ({ name: t.name })), [{ name: 'Nước mắm “kẹo”' }]);
    var hasRice = idx >= 1;
    var plate = 'position: relative; width: min(100%, 520px); aspect-ratio: 1 / 1; border-radius: 50%; background: radial-gradient(circle at 45% 40%, #FFFFFF 0%, #FBFAF6 55%, #ECE8DE 72%, #FFFFFF 74%, #F1EEE6 100%); border: 2px solid #2A1A12; box-shadow: 0 18px 0 rgba(42,26,18,.35), inset 0 -10px 24px rgba(42,26,18,.12); transition: transform .6s cubic-bezier(.2,.8,.3,1.2);';
    if (step === 'served') plate += ' transform: scale(1.04) rotate(-2deg);';
    return {
      steps: steps, tops: tops,
      has: { suon: !!sel.suon, bi: !!sel.bi, cha: !!sel.cha, trung: !!sel.trung, dochua: !!sel.dochua, rau: !!sel.rau },
      hasRice: hasRice, empty: !hasRice,
      isStart: step === 'start', isPick: step === 'pick', isSauce: step === 'sauce', served: step === 'served',
      showBowl: step === 'sauce' || step === 'served', bowlClass: st.pouring ? 'tam-tilt' : '',
      pouring: st.pouring, poured: st.poured, notPoured: !st.poured && !st.pouring, canServe: st.poured,
      plateStyle: plate,
      result: r, extra: extra, receipt: receipt,
      scoop: () => { if (this.state.step === 'start') window.TamOiAnalytics?.trackEvent('rice_game_start'); this.setState({ step: 'pick' }); },
      toSauce: () => this.setState({ step: 'sauce' }),
      back: () => { clearTimeout(this.t1); this.setState({ step: 'pick', pouring: false, poured: false }); },
      pour: () => { if (this.state.pouring || this.state.poured || this.state.step !== 'sauce') return; this.setState({ pouring: true }); this.t1 = setTimeout(() => { if (this.state.step === 'sauce') this.setState({ pouring: false, poured: true }); }, 1700); },
      serve: () => { if (this.state.step !== 'served') window.TamOiAnalytics?.trackEvent('rice_game_complete'); this.setState({ step: 'served' }); },
      reset: () => { if (this.state.step !== 'start') window.TamOiAnalytics?.trackEvent('rice_game_restart'); clearTimeout(this.t1); this.setState({ step: 'start', sel: {}, pouring: false, poured: false }); }
    };
  }
}
TamOi.mount(Component);
</script>
