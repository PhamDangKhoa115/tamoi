<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { step: 0, sent: false, area: 'all', userShops: TamOiSubmissions.list(), busy: false, fQuan: '', fStory: '', fArea: 'Long Bình', hint: '' };
  }
  renderVals() {
    var seed = [
      { name: 'Cơm tấm Ba Thiện', area: 'Long Bình', addr: 'Đường 9A/31 Phước Thiện, Long Bình', note: 'Nơi tụi mình quay phim Tấm Ơi!', kind: 'partner' },
      { name: 'Cơm tấm Lyla', area: 'Long Bình', addr: '169 Nguyễn Văn Tăng', note: '“[Lời kể bạn gửi]”', kind: 'ok' },
      { name: 'Cơm Tấm 153', area: 'Long Bình', addr: '46 Đường 9A, Long Bình', note: '“[Lời kể bạn gửi]”', kind: 'ok' },
      { name: 'Cơm Tấm Làng', area: 'Long Thạnh Mỹ', addr: '163 Nguyễn Văn Tăng, Long Thạnh Mỹ', note: '“[Lời kể bạn gửi]”', kind: 'ok' },
      { name: 'Cơm Tấm Tuyết Hân', area: 'Phước Bình', addr: '9 Đường số 18B, Phước Bình', note: '“[Lời kể bạn gửi]”', kind: 'ok' },
      { name: 'Cơm Tấm Minh Ngọc', area: 'Phước Long B', addr: '383 Đỗ Xuân Hợp, Phước Long B', note: '“[Lời kể bạn gửi]”', kind: 'ok' }
    ];
    var allShops = [seed[0]].concat(this.state.userShops, seed.slice(1));
    var areaList = ['all', 'Long Bình', 'Long Thạnh Mỹ', 'Phước Long B', 'Phước Bình', 'Khu vực khác'];
    var curArea = this.state.area;
    var areas = areaList.map((a) => {
      var on = a === curArea;
      return {
        label: a === 'all' ? 'Tất cả' : a,
        pressed: on ? 'true' : 'false',
        style: 'font-family: Montserrat, sans-serif; font-weight: 700; font-size: 13px; padding: 10px 14px; min-height: 40px; border-radius: 999px; border: 2px solid #2A1A12; cursor: pointer; ' + (on ? 'background: #F2B234; color: #2A1A12;' : 'background: #FFFFFF; color: #2A1A12;'),
        pick: () => this.setState({ area: a })
      };
    });
    var badges = {
      partner: { t: 'Quán đồng hành', st: 'background: #8F1311; color: #FFF4E2;' },
      ok: { t: 'Gen Z gợi ý', st: 'background: #1E7A79; color: #FFFFFF;' },
      pending: { t: 'Được người dùng gợi ý', st: 'background: #F2B234; color: #2A1A12; border: 1.5px solid #2A1A12;' }
    };
    var shops = allShops.filter((s) => curArea === 'all' || s.area === curArea).map((s) => Object.assign({}, s, {
      badge: badges[s.kind].t,
      badgeStyle: 'font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px; ' + badges[s.kind].st,
      style: 'padding: 12px 14px; border-radius: 14px; display: flex; flex-direction: column; gap: 4px; border: 2px solid #2A1A12; ' + (s.kind === 'partner' ? 'background: #FBE3C8;' : (s.kind === 'pending' ? 'background: #FFFFFF; border-style: dashed;' : 'background: #FFFFFF;')),
      map: 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(s.name + ' ' + s.addr + ' Thủ Đức')
    }));
    var shopCount = allShops.length + ' quán';
    var lines = [
      'Bấm nút bên phải để gọi tui thử coi!',
      'Ủa… ai gọi tui đó?',
      'Hả? Người ta gọi… dĩa cơm hả?!',
      'Thôi được, cho Tấm một dĩa đầy đủ luôn!'
    ];
    var imgs = [
      'assets/acbe4385141fd69c0ef670affba1114a.webp',
      'assets/3fbf4c1d8cab475c5daf3cb0e2b82c79.webp',
      'assets/acbe4385141fd69c0ef670affba1114a.webp',
      'assets/65c440a850941abdbe8a8400fdb1313f.webp'
    ];
    var s = this.state.step;
    return {
      bubble: lines[s],
      tamImg: imgs[s],
      callTam: () => this.setState({ step: s >= 3 ? 1 : s + 1 }),
      areas: areas,
      shops: shops,
      shopCount: shopCount,
      fQuan: this.state.fQuan,
      fStory: this.state.fStory,
      fArea: this.state.fArea,
      formHint: this.state.hint,
      busy: this.state.busy,
      setQuan: (e) => this.setState({ fQuan: e.target.value }),
      setStory: (e) => this.setState({ fStory: e.target.value }),
      setArea: (e) => this.setState({ fArea: e.target.value }),
      sent: this.state.sent,
      notSent: !this.state.sent,
      again: () => this.setState({ sent: false }),
      send: async (e) => {
        e.preventDefault();
        if (this.state.busy) return;
        var form = e.currentTarget;
        if (!form.reportValidity()) return;
        var input = { name: this.state.fQuan, area: this.state.fArea, story: this.state.fStory };
        var error = TamOiSubmissions.validate(input);
        if (error) { this.setState({ hint: error }); return; }
        this.setState({ busy: true, hint: '' });
        try {
          await TamOiSubmissions.submit(input);
          this.setState({ sent: true, busy: false, hint: '', userShops: TamOiSubmissions.list(), fQuan: '', fStory: '', fArea: 'Long Bình', area: 'all' });
        } catch (error) {
          this.setState({ busy: false, hint: error.message });
        }
      }
    };
  }
}
TamOi.mount(Component);
</script>
